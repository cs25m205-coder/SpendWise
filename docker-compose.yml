services:

  postgres:
    image: postgres:16
    container_name: spendwise-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spendwise

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: